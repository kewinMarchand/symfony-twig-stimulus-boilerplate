# Règles de dépendance entre modules et couches (R12 de ARCHITECTURE-DDD.md).
# Domain ne dépend que de lui-même (ni framework, ni autre couche, ni autre module). Application du
# Domain de son module. Infrastructure du Domain et de l'Application de son module, et des frameworks.
# UI du Domain et de l'Application de son module, de Shared et des frameworks, et de l'Infrastructure
# seulement pour les modules sans couche Application (forme réduite : Contact, Task).
# Site compose les modules (Domain et Application), Shared ne dépend d'aucun module ni de Site.
# Le client HTTP de l'API (HttpClient) n'est permis qu'aux couches Infrastructure.
# make arch-selftest vérifie que des violations volontaires font bien échouer l'analyse.
deptrac:
    paths:
        - ./src
    layers:
        - name: CatalogDomain
          collectors:
            - type: classLike
              value: '^App\\Catalog\\Domain\\'
        - name: CatalogApplication
          collectors:
            - type: classLike
              value: '^App\\Catalog\\Application\\'
        - name: CatalogInfrastructure
          collectors:
            - type: classLike
              value: '^App\\Catalog\\Infrastructure\\'
        - name: CatalogUI
          collectors:
            - type: classLike
              value: '^App\\Catalog\\UI\\'
        - name: BlogDomain
          collectors:
            - type: classLike
              value: '^App\\Blog\\Domain\\'
        - name: BlogInfrastructure
          collectors:
            - type: classLike
              value: '^App\\Blog\\Infrastructure\\'
        - name: ContactDomain
          collectors:
            - type: classLike
              value: '^App\\Contact\\Domain\\'
        - name: ContactInfrastructure
          collectors:
            - type: classLike
              value: '^App\\Contact\\Infrastructure\\'
        - name: ContactUI
          collectors:
            - type: classLike
              value: '^App\\Contact\\UI\\'
        - name: TaskDomain
          collectors:
            - type: classLike
              value: '^App\\Task\\Domain\\'
        - name: TaskInfrastructure
          collectors:
            - type: classLike
              value: '^App\\Task\\Infrastructure\\'
        - name: TaskUI
          collectors:
            - type: classLike
              value: '^App\\Task\\UI\\'
        - name: Site
          collectors:
            - type: classLike
              value: '^App\\Site\\'
        - name: SharedUI
          collectors:
            - type: classLike
              value: '^App\\Shared\\UI\\'
        - name: SharedInfrastructure
          collectors:
            - type: classLike
              value: '^App\\Shared\\Infrastructure\\'
        - name: HttpClient
          collectors:
            - type: classLike
              value: '^Symfony\\(Contracts|Component)\\HttpClient\\'
        - name: Framework
          collectors:
            - type: classLike
              value: '^(?!Symfony\\(Contracts|Component)\\HttpClient\\)(Symfony|Doctrine|Psr|Twig)\\'
    ruleset:
        CatalogDomain: ~
        CatalogApplication: [CatalogDomain]
        CatalogInfrastructure: [CatalogDomain, CatalogApplication, Framework, HttpClient]
        CatalogUI: [CatalogDomain, CatalogApplication, SharedUI, Framework]
        BlogDomain: ~
        BlogInfrastructure: [BlogDomain, Framework, HttpClient]
        ContactDomain: ~
        ContactInfrastructure: [ContactDomain, Framework, HttpClient]
        ContactUI: [ContactDomain, ContactInfrastructure, SharedUI, Framework]
        TaskDomain: ~
        TaskInfrastructure: [TaskDomain, Framework, HttpClient]
        TaskUI: [TaskDomain, TaskInfrastructure, SharedUI, Framework]
        Site: [CatalogDomain, CatalogApplication, BlogDomain, ContactDomain, TaskDomain, SharedUI, Framework]
        SharedUI: [Framework]
        SharedInfrastructure: [Framework, HttpClient]
