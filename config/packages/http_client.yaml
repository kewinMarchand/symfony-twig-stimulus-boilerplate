framework:
    http_client:
        scoped_clients:
            # Seul client de l'API commune, injecté par son nom ($apiClient) dans les Infrastructure/Http des modules.
            api.client:
                base_uri: '%env(API_URL)%'
                headers:
                    Accept: application/json
                timeout: 5

# En test, aucune API à démarrer : des réponses réelles capturées sur l'API (tests/Fixtures/api/).
when@test:
    framework:
        http_client:
            mock_response_factory: App\Tests\Support\ApiMockResponseFactory
