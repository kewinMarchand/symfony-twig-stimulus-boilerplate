# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/*/Domain/'
            - '../src/Kernel.php'

    App\Task\Domain\TaskRepository: '@App\Task\Infrastructure\InMemory\InMemoryTaskRepository'
    App\Blog\Domain\ArticleRepository: '@App\Blog\Infrastructure\InMemory\InMemoryArticleRepository'
    App\Site\Home\SlideRepository: '@App\Site\Home\InMemorySlideRepository'
    App\Contact\Domain\ContactMessageSender: '@App\Contact\Infrastructure\Logger\LoggerContactMessageSender'
    App\Catalog\Domain\CatalogRepository: '@App\Catalog\Infrastructure\InMemory\InMemoryCatalogRepository'

when@test:
    services:
        logger:
            class: Psr\Log\NullLogger
